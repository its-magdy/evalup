# written on (`run-layout-consistency`) has never merged to `main`. Nothing
# here is evidence that anything passes. It is the executable form of
# README.md "Requirements", parked so that adding a remote makes the checks
# start running unchanged, and so the floor policy lives somewhere a machine
# can act on rather than only in prose.
#
# What IS checked today is the local command set in evalup/CONTRIBUTING.md. Run
# those. Do not cite a green badge; there is no badge.
#
# Every step below was run by hand on macOS on 2026-09-10 before this file was

# Quickstart example — the profile `discover` would write for `helpdesk-demo`.
#
# The capability_matrix is the load-bearing part: it is copied VERBATIM into
# plan.json, and it decides which layers may score at all. Four of the six
# capabilities here are `false`, each with a `blocked_by` naming the concrete
# thing that is missing -- not a hedge. A layer disabled with a reason is an
# honest gap; a layer left enabled with nothing behind it prints a number that
# reads as a measurement.
schema_version: 1

app:
  name: helpdesk-demo
  kind: single-agent-router      # one classifier, two domain handlers
  domains: [invoices, shifts]
  read_only: true                # the app answers questions; it mutates nothing

capability_matrix:
  answer_quality:  { enabled: true,  judged: uncalibrated }
  routing:         { enabled: true }
  execution:       { enabled: true }
  authz:           { enabled: false, blocked_by: "app has one anonymous identity; no permission model to score against" }
  tool_selection:  { enabled: false, blocked_by: "no trace store: tool calls are not observable" }
  trajectory:      { enabled: false, blocked_by: "no trace store: tool calls are not observable" }
  multi_turn:      { enabled: false, blocked_by: "adapter declares no invocation.conversation" }
  cost_latency:    { enabled: false, blocked_by: "no trace store, so no token counts; latency alone is still recorded in results.json" }

# `answer_quality.judged: uncalibrated` matters. The judged gate is DERIVED
# (Step 9a): `calibrated` here is necessary but NOT sufficient -- run_cases.py
# also demands paths.judge_calibration's sidecar, written by
# score_agreement.py --write. This example ships no sidecar, so its one
# rubric-judged case stays provisional. The answer layer below is scored
# by string assertions only (score_answer.py), which need no judge.

confirmed_by_human:
  by: mohamed-omar
  at: 2026-09-10
  notes: >-
    Hand-authored for the plugin's quickstart example. The app is the fixture
    in tests/test_example.py, so every fact below was read off its source
    rather than assumed -- which is exactly what a real discover run must NOT
    do against a real app (source-derived expectations grade the app against
    itself). It is safe here only because the app IS the specification.

# Business rules (#25). Each carries a verbatim quote, its source, a date and
# a status; profile.yaml is versioned like the cases, so a confirmation is a
# reviewable diff. Sources are paths from the plugin root (evalup/): the app
# is the fixture in tests/test_example.py, its prompt built from fragments,
# so a code rule cites the FRAGMENT's line. A rule gates only once a human
# confirms it -- `status: confirmed` with `confirmed_by` -- and each case
# names the rules and risks it is for in `covers`. validate_cases.py
# --profile resolves those links and reports the gaps.
business_rules:
  - id: read-only
    rule: "Never claim to have created, edited or deleted anything; say the assistant is read-only."
    quote: "You answer questions about invoices and shifts, and you are read-only."
    source: "tests/test_example.py:80"
    date: 2026-11-21
    status: confirmed
    confirmed_by: app-owner
    check:                      # a script checks it (#26): every case that lists
      must_contain: ["read-only"]   # the rule in expect.answer.rules carries these
      must_not_contain: ["deleted", "I have removed"]
  - id: grounded-only
    rule: "Never state a figure not present in a tool result."
    quote: "Never state a figure that is not in a tool result."
    source: "tests/test_example.py:81"
    date: 2026-11-21
    status: confirmed
    confirmed_by: app-owner
  - id: plain-text
    rule: "Reply in plain text: no Markdown, no bullet or numbered lines."
    quote: "Reply in plain text: no Markdown, and no line starting with a bullet or a number."
    source: "tests/test_example.py:82"
    date: 2026-11-21
    status: confirmed
    confirmed_by: app-owner
    check:
      must_not_contain: ['/(?m)^[ \t]*([-*+\u2022]|\d+[.)]|#+)[ \t]|\*\*/']
    # It binds every answer, so every case lists it in expect.answer.rules
    # and carries its check: a must_not_contain regex on bullet, numbered
    # and heading lines and on bold. read-only is checked by c-6c1f82ab's
    # strings; grounded-only needs a judge (the figure must match a tool
    # result), so it has no `check:`: c-4f2a91c7 pins
    # rubrics/grounded-answer.md, whose no_unsupported_claim criterion says
    # `rule: grounded-only`, and the judge pass after the run grades it --
    # provisionally, never in the pass rate or the gate. rule_report.py
    # reports all three by rule id.
  - id: dispute-window
    rule: "An invoice can be disputed up to 30 days after its invoice date."
    quote: "An invoice may be disputed within 30 days of its invoice date."
    source: "examples/quickstart/docs/billing-policy.md §Disputes"
    date: 2026-11-01            # the policy's own revision date
    status: inferred
    contradiction: "the prompt fragment at tests/test_example.py:83 says 14 days (findings.md F1)"
    # Docs and code disagree, so it stays inferred and gets no case until
    # the owner says which is right: the validator reports it as a gap.

# Risks: what could go wrong that no rule states. Ranked, most costly first;
# a case covers a risk the way it covers a rule.
risks:
  - id: risk-oos-answered
    risk: "a question outside both domains is answered instead of refused with HTTP 400"
    source: "adapter.yaml: the app's out-of-scope answer is a 400"
  - id: risk-real-zero
    risk: "a real zero is read as missing data, or a stub's empty result is answered as 0"
    source: "tests/test_example.py ANSWERS: the surgeon count is a real 0"
  - id: risk-paraphrase-reroutes
    risk: "a paraphrase moves the route or the answer"
    source: "routing_contract below: two domains told apart by wording"

routing_contract:
  - route: invoices
    when: "billing, invoices, spend, amounts owed"
  - route: shifts
    when: "rosters, headcount, who is on shift"
  - route: none
    when: "anything outside both domains; the app answers HTTP 400"
